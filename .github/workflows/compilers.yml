name: Compilers

# Project-owned workflow (not managed by `fobis scaffold`): the tests built by FoBiS with Ubuntu 24.04's own gfortran 13
# and 14 (13.3 and 14.2), the oldest compilers supported. Every other build runs in the fortran-toolchains images
# (matrix.yml: gfortran 16.2, ifx, nvfortran; ci.yml, fpm.yml).

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fobis:
    name: fobis tests-gnu-debug / gfortran-${{ matrix.gcc }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        gcc: ['13', '14']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Ubuntu's compiler, FoBiS in a venv (Ubuntu's python3 is externally managed)
    - name: Install gfortran ${{ matrix.gcc }} and FoBiS
      timeout-minutes: 10
      env:
        DEBIAN_FRONTEND: noninteractive
        GCC: ${{ matrix.gcc }}
      run: |
        sudo rm -f /var/lib/man-db/auto-update
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends "gfortran-$GCC"
        sudo update-alternatives --install /usr/bin/gfortran gfortran "/usr/bin/gfortran-$GCC" 100
        python3 -m venv "$RUNNER_TEMP/venv"
        "$RUNNER_TEMP/venv/bin/pip" install --quiet FoBiS.py
        echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
        gfortran --version | sed -n 1p

    - name: Fetch dependencies
      run: fobis fetch --no-build

    - name: Build
      run: fobis build --mode tests-gnu-debug

    - name: Test
      run: bash scripts/run_tests.sh
